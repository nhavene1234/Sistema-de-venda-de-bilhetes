<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagamento | Sistema de Bilhetes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <a class="marca marca-escura" href="painel.html"><span class="marca-icone"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="15" rx="3"/><path d="M3 11h18"/><circle cx="8" cy="20.5" r="1" fill="currentColor"/><circle cx="16" cy="20.5" r="1" fill="currentColor"/></svg></span><span class="marca-texto"><strong>Sistema de Bilhetes</strong><small>Viagens interprovinciais em Moçambique</small></span></a>
    <div class="topo-utilizador">
      <span id="topo-nome"></span>
      <span class="selo" id="topo-perfil"></span>
      <a class="botao botao-secundario botao-pequeno" href="painel.html">Início</a>
      <button type="button" id="sair" class="botao botao-secundario botao-pequeno">Sair</button>
    </div>
  </header>

  <main class="conteudo">
    <div id="alerta" role="alert" hidden></div>
    <h1>Pagamento</h1>
    <p class="subtitulo">Simulação de pagamento por M-Pesa ou e-Mola.</p>

    <div id="conteudo-pagamento" hidden>
      <div class="pagamento-layout">
        <div>
          <dl class="dados" id="resumo"></dl>
          <p class="cronometro-caixa">Tempo restante para pagar: <strong id="cronometro">--:--</strong></p>
        </div>

        <form id="form-pagamento" class="cartao-formulario" novalidate>
          <div class="campo">
            <span class="rotulo-grupo">Método de pagamento</span>
            <div class="opcoes-metodo">
              <label class="opcao-metodo">
                <input type="radio" name="metodo" value="MPESA" required> M-Pesa
              </label>
              <label class="opcao-metodo">
                <input type="radio" name="metodo" value="EMOLA"> e-Mola
              </label>
            </div>
          </div>
          <div class="campo">
            <label for="numeroTelefone">Número de telefone</label>
            <input id="numeroTelefone" name="numeroTelefone" type="tel" placeholder="84 1234567" required>
            <p class="erro-campo" data-erro-para="numeroTelefone" hidden></p>
            <p class="ajuda">Simulação: qualquer número moçambicano válido é aceite.</p>
          </div>
          <button type="submit" class="botao botao-primario">Confirmar pagamento</button>
        </form>
      </div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/topo.js"></script>
  <script src="js/pagamento.js"></script>
</body>
</html>
