<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comprovativo | Sistema de Bilhetes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <a class="marca marca-escura" href="painel.html"><span class="marca-icone"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="15" rx="3"/><path d="M3 11h18"/><circle cx="8" cy="20.5" r="1" fill="currentColor"/><circle cx="16" cy="20.5" r="1" fill="currentColor"/></svg></span><span class="marca-texto"><strong>Sistema de Bilhetes</strong><small>Viagens interprovinciais em Moçambique</small></span></a>
    <div class="topo-utilizador">
      <span id="topo-nome"></span>
      <span class="selo" id="topo-perfil"></span>
      <a class="botao botao-secundario botao-pequeno" href="painel.html">Início</a>
      <button type="button" id="sair" class="botao botao-secundario botao-pequeno">Sair</button>
    </div>
  </header>

  <main class="conteudo conteudo-estreita">
    <div id="alerta" role="alert" hidden></div>
    <h1>Comprovativo da venda</h1>

    <article id="conteudo-comprovativo" class="bilhete bilhete-grande" hidden>
      <div class="bilhete-topo">
        <p class="bilhete-transportadora" id="c-transportadora"></p>
        <div class="trajeto">
          <div class="trajeto-ponta"><span class="cidade" id="c-origem"></span></div>
          <div class="linha-rota"><span class="paragem"></span><span class="paragem"></span></div>
          <div class="trajeto-ponta"><span class="cidade" id="c-destino"></span></div>
        </div>
      </div>
      <div class="picotado"></div>
      <div class="bilhete-base">
        <dl class="bilhete-dados bilhete-dados-grande">
          <div><dt>Passageiro</dt><dd id="c-passageiro"></dd></div>
          <div><dt>Data</dt><dd id="c-data"></dd></div>
          <div><dt>Partida</dt><dd id="c-hora"></dd></div>
          <div><dt>Lugar</dt><dd id="c-lugar"></dd></div>
          <div><dt>Preço</dt><dd id="c-preco"></dd></div>
          <div><dt>Pagamento</dt><dd id="c-metodo"></dd></div>
          <div><dt>Referência</dt><dd id="c-referencia"></dd></div>
        </dl>
        <div id="c-qr" class="qr-bilhete"></div>
      </div>
      <p class="bilhete-codigo-texto">Código: <strong id="c-codigo"></strong></p>
    </article>

    <button type="button" id="nova-venda" class="botao botao-primario" style="margin-top:1.25rem">Registar nova venda</button>
  </main>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/topo.js"></script>
  <script src="js/comprovativo.js"></script>
</body>
</html>
