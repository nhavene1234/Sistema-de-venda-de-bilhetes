<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escolher lugar | Sistema de Bilhetes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <a class="marca marca-escura" href="painel.html"><span class="marca-icone"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="15" rx="3"/><path d="M3 11h18"/><circle cx="8" cy="20.5" r="1" fill="currentColor"/><circle cx="16" cy="20.5" r="1" fill="currentColor"/></svg></span><span class="marca-texto"><strong>Sistema de Bilhetes</strong><small>Viagens interprovinciais em Moçambique</small></span></a>
    <div class="topo-utilizador">
      <span id="topo-nome"></span>
      <span class="selo" id="topo-perfil"></span>
      <a class="botao botao-secundario botao-pequeno" href="painel.html">Início</a>
      <button type="button" id="sair" class="botao botao-secundario botao-pequeno">Sair</button>
    </div>
  </header>

  <main class="conteudo conteudo-com-barra">
    <div id="alerta" role="alert" hidden></div>
    <p class="voltar"><a href="pesquisa.html">Voltar à pesquisa</a></p>
    <h1 id="titulo-pagina">Escolha o seu lugar</h1>

    <div id="conteudo-lugares" class="lugares-pagina" hidden>
      <div>
        <dl class="dados" id="resumo"></dl>
        <ul class="legenda" aria-label="Legenda dos lugares">
          <li><i class="lugar-livre"></i>Livre</li>
          <li><i class="lugar-selecionado-legenda"></i>Selecionado</li>
          <li><i class="lugar-ocupado"></i>Ocupado</li>
        </ul>
        <p class="nota">O lugar fica reservado por 15 minutos enquanto efetua o pagamento.</p>
      </div>
      <div class="autocarro-mapa">
        <p class="frente">Frente do autocarro</p>
        <div id="filas"></div>
      </div>
    </div>

    <div id="barra-selecao" class="barra-inferior" hidden>
      <span id="texto-selecao"></span>
      <button type="button" id="confirmar-lugar" class="botao botao-primario botao-largura-auto">Continuar para o pagamento</button>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/topo.js"></script>
  <script src="js/lugares.js"></script>
</body>
</html>
