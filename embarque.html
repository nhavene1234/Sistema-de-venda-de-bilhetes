<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embarque | Sistema de Bilhetes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <a class="marca marca-escura" href="painel.html"><span class="marca-icone"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="15" rx="3"/><path d="M3 11h18"/><circle cx="8" cy="20.5" r="1" fill="currentColor"/><circle cx="16" cy="20.5" r="1" fill="currentColor"/></svg></span><span class="marca-texto"><strong>Sistema de Bilhetes</strong><small>Viagens interprovinciais em Moçambique</small></span></a>
    <div class="topo-utilizador">
      <span id="topo-nome"></span>
      <span class="selo" id="topo-perfil"></span>
      <a class="botao botao-secundario botao-pequeno" href="painel.html">Início</a>
      <button type="button" id="sair" class="botao botao-secundario botao-pequeno">Sair</button>
    </div>
  </header>

  <main class="conteudo">
    <div id="alerta" role="alert" hidden></div>

    <div id="painel-viagens">
      <h1>Embarque</h1>
      <p class="subtitulo">Escolha a viagem para validar os bilhetes.</p>
      <div class="campo campo-data-cobrador">
        <label for="data-viagens">Data</label>
        <input id="data-viagens" type="date">
      </div>
      <div id="lista-viagens-cobrador" class="lista"></div>
    </div>

    <div id="painel-embarque" hidden>
      <p class="voltar"><button type="button" id="voltar-viagens" class="botao botao-secundario botao-pequeno">Voltar às viagens</button></p>
      <h1 id="titulo-embarque">Viagem</h1>

      <form id="form-validar" class="leitor-codigo" novalidate>
        <div class="campo">
          <label for="codigo">Código do bilhete</label>
          <input id="codigo" name="codigo" type="text" autocomplete="off" required
                 placeholder="Ex.: BLT-ABCD1234EFGH5678">
          <p class="erro-campo" data-erro-para="codigo" hidden></p>
          <p class="ajuda">Digite ou cole o código apresentado no bilhete do passageiro.</p>
        </div>
        <button type="submit" class="botao botao-primario botao-largura-auto">Validar</button>
      </form>
      <p id="resultado-validacao" class="resultado-validacao" hidden></p>

      <h2>Passageiros confirmados</h2>
      <div id="lista-passageiros" class="lista-passageiros"></div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/topo.js"></script>
  <script src="js/embarque.js"></script>
</body>
</html>
