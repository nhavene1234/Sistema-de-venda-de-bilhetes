<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viagens | Sistema de Bilhetes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <a class="marca marca-escura" href="painel.html"><span class="marca-icone"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="15" rx="3"/><path d="M3 11h18"/><circle cx="8" cy="20.5" r="1" fill="currentColor"/><circle cx="16" cy="20.5" r="1" fill="currentColor"/></svg></span><span class="marca-texto"><strong>Sistema de Bilhetes</strong><small>Viagens interprovinciais em Moçambique</small></span></a>
    <div class="topo-utilizador">
      <span id="topo-nome"></span>
      <span class="selo" id="topo-perfil"></span>
      <a class="botao botao-secundario botao-pequeno" href="painel.html">Início</a>
      <button type="button" id="sair" class="botao botao-secundario botao-pequeno">Sair</button>
    </div>
  </header>

  <main class="conteudo">
    <div id="alerta" role="alert" hidden></div>
    <div class="cabecalho-secao">
      <div>
        <h1>Viagens</h1>
        <p class="subtitulo">As viagens agendadas da sua transportadora.</p>
      </div>
      <button type="button" id="nova-viagem" class="botao botao-primario botao-largura-auto">Nova viagem</button>
    </div>

    <label class="opcao-check">
      <input type="checkbox" id="ver-passadas">
      Mostrar também viagens passadas e canceladas
    </label>

    <div id="lista-viagens" class="lista"></div>

    <div id="painel-formulario" class="painel-lateral" hidden>
      <div class="painel-lateral-caixa">
        <h2 id="titulo-formulario">Nova viagem</h2>
        <div id="alerta-formulario" role="alert" hidden></div>
        <p id="aviso-com-reservas" class="alerta alerta-aviso" hidden>
          Esta viagem já tem reservas. Só pode alterar o preço e a hora de chegada.
        </p>
        <form id="form-viagem" novalidate>
          <div class="campo">
            <label for="idRota">Rota</label>
            <select id="idRota" name="idRota" required></select>
            <p class="erro-campo" data-erro-para="idRota" hidden></p>
          </div>
          <div class="campo">
            <label for="idAutocarro">Autocarro</label>
            <select id="idAutocarro" name="idAutocarro" required></select>
            <p class="erro-campo" data-erro-para="idAutocarro" hidden></p>
          </div>
          <div class="campo">
            <label for="data">Data</label>
            <input id="data" name="data" type="date" required>
            <p class="erro-campo" data-erro-para="data" hidden></p>
          </div>
          <div class="campo">
            <label for="horaPartida">Hora de partida</label>
            <input id="horaPartida" name="horaPartida" type="time" required>
            <p class="erro-campo" data-erro-para="horaPartida" hidden></p>
          </div>
          <div class="campo">
            <label for="horaChegada">Hora de chegada prevista (opcional)</label>
            <input id="horaChegada" name="horaChegada" type="time">
            <p class="erro-campo" data-erro-para="horaChegada" hidden></p>
          </div>
          <div class="campo">
            <label for="preco">Preço (MT)</label>
            <input id="preco" name="preco" type="number" min="0.01" step="0.01" required>
            <p class="erro-campo" data-erro-para="preco" hidden></p>
          </div>
          <div class="acoes-formulario">
            <button type="button" id="cancelar-edicao" class="botao botao-secundario">Cancelar</button>
            <button type="submit" class="botao botao-primario">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/topo.js"></script>
  <script src="js/viagens.js"></script>
</body>
</html>
